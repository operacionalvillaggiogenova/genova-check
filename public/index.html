<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123047"><meta name="description" content="Genova Suite — atividades e ferramentas de campo."><meta name="apple-mobile-web-app-title" content="Genova Suite">
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="stylesheet" href="v11.css"><title>Genova Suite</title>
</head>
<body>
  <header class="app-topbar">
    <a class="app-brand" href="/"><span class="brand-mark">✓</span><span>Genova Suite</span></a>
    <div class="topbar-actions"><span id="syncStatus" class="sync-status">Verificando…</span><a id="fieldSettingsLink" class="user-button" href="/settings.html" aria-label="Configurações das ferramentas" hidden>⚙</a><button id="userButton" class="user-button" type="button" aria-label="Conta do usuário">•••</button></div>
  </header>
  <main class="app-main">
    <section class="welcome-row">
      <div><p class="eyebrow">ROTINA DE HOJE</p><h1 id="welcomeName">Minhas atividades</h1><p id="userMeta" class="user-meta"></p></div>
      <a id="toolsButton" class="tools-button" href="/tools.html">Ferramentas</a>
    </section>

    <section class="metric-strip" aria-label="Resumo das atividades">
      <button data-filter="today"><span id="metricTotal">0</span><small>Total hoje</small></button>
      <button data-filter="overdue"><span id="metricOverdue">0</span><small>Atrasadas</small></button>
      <button data-filter="pending"><span id="metricPending">0</span><small>Pendentes</small></button>
    </section>

    <section class="section-card">
      <div class="section-heading"><div><h2>Atividades prioritárias</h2><p>Em andamento, atrasadas e próximas do prazo.</p></div><a href="/activities.html">Ver todas</a></div>
      <div id="activityList" class="activity-list"><p class="empty-state">Carregando atividades…</p></div>
    </section>
  </main>

  <dialog id="userDialog" class="app-dialog compact-dialog">
    <div class="dialog-shell"><div class="dialog-heading"><h2>Minha conta</h2><button data-close="userDialog" class="icon-close">×</button></div>
      <div id="accountSummary" class="account-summary"></div>
      <div class="dialog-actions"><a id="settingsLink" class="secondary-action" href="/admin-config.html">Configurações</a><button id="logoutButton" class="danger-action" type="button">Sair</button></div>
    </div>
  </dialog>

  <script src="auth-client.js"></script><script src="activity-offline.js"></script><script src="home.js"></script>
</body>
</html>
