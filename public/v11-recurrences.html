<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recorrências - Blexo Suite</title><link rel="stylesheet" href="v11.css"></head><body><main class="container"><div class="flex justify-between items-center mb-4"><div><h1 class="page-title" style="margin:0">Recorrências</h1><p class="text-muted text-sm">Modelos programados; a pendência é criada na data de execução.</p></div><button id="new" class="btn btn-primary hidden">Nova recorrência</button></div><div class="form-group"><label for="range">Planejamento</label><select id="range"><option value="all">Todas as próximas execuções</option><option value="7">Próximos 7 dias</option><option value="30">Próximos 30 dias</option><option value="90">Próximos 90 dias</option></select></div><div id="list"></div></main><dialog id="modal"><form id="form"><div class="dialog-header"><h2 id="modalTitle">Nova recorrência</h2><button type="button" class="btn btn-outline" id="close">Fechar</button></div><div class="dialog-content"><div class="form-group"><label>Título</label><input id="title" required minlength="3"></div><div class="grid grid-cols-2 gap-3"><div class="form-group"><label>Equipe</label><select id="team"></select></div><div class="form-group"><label>Frequência</label><select id="kind"><option value="daily">Diária</option><option value="weekly">Semanal</option><option value="monthly">Mensal</option><option value="custom">Personalizada</option></select></div></div><div class="grid grid-cols-2 gap-3"><div class="form-group"><label id="intervalLabel">Intervalo (dias)</label><input id="interval" type="number" min="1" value="1"></div><div class="form-group"><label>Próxima execução</label><input id="starts" type="datetime-local" required></div></div><p id="intervalHelp" class="text-muted text-sm">2 gera uma atividade a cada 2 dias.</p><div class="form-group"><label>Descrição</label><textarea id="description"></textarea></div><div id="error" class="error-msg hidden"></div></div><div class="dialog-footer"><button class="btn btn-primary">Salvar</button></div></form></dialog></body><script src="v11-api.js"></script><script src="v11-shell.js"></script><script>const $=x=>document.getElementById(x);let rows=[],editing=null;const local=v=>{const d=new Date(v);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};const cadence=r=>{const n=r.interval_value,u={daily:'dia',weekly:'semana',monthly:'mês',custom:'dia'}[r.recurrence_type];return `a cada ${n} ${u}${n==1?'':'s'}`};function hint(){const k=$('kind').value,u=k==='monthly'?'meses':k==='weekly'?'semanas':'dias';$('intervalLabel').textContent=`Intervalo (${u})`;$('intervalHelp').textContent=k==='monthly'?'Ex.: 6 gera uma atividade a cada 6 meses.':`Ex.: 2 gera uma atividade a cada 2 ${u}.`}function draw(){const n=Number($('range').value),limit=n?Date.now()+n*864e5:null,view=rows.filter(r=>!limit||new Date(r.next_run_at)<=limit);$('list').innerHTML=view.length?view.map(r=>`<article class="card" style="margin-bottom:10px"><div class="flex justify-between items-center"><div><strong>${shell.escape(r.title)}</strong><div class="text-muted text-sm">${shell.escape(r.team)} · ${cadence(r)} · próxima: ${shell.formatDate(r.next_run_at)}</div></div>${shell.has('activities.update')?`<div class="flex gap-2"><button class="btn btn-outline" data-edit="${r.id}">Editar</button><button class="btn ${r.active?'btn-danger':'btn-secondary'}" data-status="${r.id}" data-active="${r.active}">${r.active?'Pausar':'Ativar'}</button></div>`:''}</div></article>`).join(''):'<div class="card text-muted">Nenhuma recorrência no período.</div>'}async function load(){rows=await api.recurrences.list();draw()}function open(r){editing=r||null;$('form').reset();$('modalTitle').textContent=r?'Editar recorrência':'Nova recorrência';$('starts').value=local(r?r.next_run_at:new Date());if(r){$('title').value=r.title;$('team').value=r.team;$('kind').value=r.recurrence_type;$('interval').value=r.interval_value;$('description').value=r.description||''}hint();$('modal').showModal()}shell.init().then(async()=>{if(!shell.has('activities.view'))return location.href='/dashboard';const teams=await api.teams.list();$('team').innerHTML=teams.filter(t=>t.active).map(t=>`<option value="${shell.escape(t.code)}">${shell.escape(t.label)}</option>`).join('');if(shell.has('activities.create'))$('new').classList.remove('hidden');$('new').onclick=()=>open();$('close').onclick=()=>$('modal').close();$('kind').onchange=hint;$('range').onchange=draw;$('list').onclick=async e=>{const edit=e.target.closest('[data-edit]'),status=e.target.closest('[data-status]');if(edit)open(rows.find(r=>r.id===edit.dataset.edit));if(status){await api.recurrences.setStatus(status.dataset.status,status.dataset.active!=='true');load()}};$('form').onsubmit=async e=>{e.preventDefault();try{const data={title:$('title').value,team:$('team').value,recurrenceType:$('kind').value,intervalValue:$('interval').value,startsAt:new Date($('starts').value).toISOString(),description:$('description').value,priority:'normal'};if(editing)await api.recurrences.update(editing.id,data);else await api.recurrences.create(data);$('modal').close();load()}catch(x){$('error').textContent=x.message;$('error').classList.remove('hidden')}};load()})</script></html>
