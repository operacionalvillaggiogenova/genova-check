<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123047"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="adm.css"><title>Blexo — Adm-Diário de Serviços</title></head><body>
<header class="topbar"><a class="brand" href="/adm.html"><span class="brand-mark">✓</span><span>Blexo-<strong>Adm-Diário de Serviços</strong></span></a><div class="top-actions"><span class="online-status">● Online</span></div></header>
<main><section class="hero compact-hero"><p class="eyebrow">ADMINISTRAÇÃO</p><h1>Adm-Diário de Serviços</h1><p>Histórico centralizado dos serviços executados, colaboradores, locais, duração, materiais e evidências.</p></section>
<section class="card"><div class="filters"><label>De<input id="from" type="date"></label><label>Até<input id="to" type="date"></label><label>Colaborador<input id="employee" placeholder="Nome"></label><label>Local<input id="location" placeholder="Bloco, área, local"></label><button id="search">Pesquisar</button></div></section>
<section class="card"><div class="section-title"><h2>Resumo</h2><button id="refresh" class="secondary-button">↻ Atualizar</button></div><div id="summary" class="admin-summary"></div></section>
<section class="card"><div class="section-title"><h2>Diários registrados</h2></div><div id="list" class="admin-table-wrap"><p class="muted">Carregando...</p></div></section>
<section id="detail" class="card" hidden><div class="section-title"><h2 id="detailTitle">Detalhes do diário</h2><button id="closeDetail" class="secondary-button">Fechar</button></div><div id="detailMeta" class="detail-meta"></div><div id="detailServices"></div></section></main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(v){return v?new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'}).format(new Date(v)):'—'}
function duration(a,b){if(!a)return'—';if(!b)return'Em andamento';const m=Math.max(0,Math.round((new Date(b)-new Date(a))/60000));return `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}min`}
async function api(u){const r=await fetch(u,{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Erro');return d}
async function load(){const q=new URLSearchParams();if($('from').value)q.set('from',$('from').value);if($('to').value)q.set('to',$('to').value);if($('employee').value)q.set('employee',$('employee').value);if($('location').value)q.set('location',$('location').value);try{const rows=await api('/api/adm/diario?'+q);const services=rows.reduce((s,r)=>s+Number(r.services_count||0),0),materials=rows.reduce((s,r)=>s+Number(r.materials_count||0),0),ev=rows.reduce((s,r)=>s+Number(r.evidence_count||0),0);$('summary').innerHTML=`<div><strong>${rows.length}</strong><span>Diários</span></div><div><strong>${services}</strong><span>Serviços</span></div><div><strong>${materials}</strong><span>Materiais</span></div><div><strong>${ev}</strong><span>Evidências</span></div>`;if(!rows.length){$('list').innerHTML='<p class="muted">Nenhum diário encontrado.</p>';return}$('list').innerHTML='<table><thead><tr><th>Data</th><th>Colaborador</th><th>Início</th><th>Fim</th><th>Serviços</th><th>Materiais</th><th>Evidências</th><th></th></tr></thead><tbody>'+rows.map(r=>`<tr><td>${fmt(r.started_at).split(',')[0]}</td><td>${esc(r.employee)||'—'}</td><td>${fmt(r.started_at)}</td><td>${fmt(r.ended_at)}</td><td>${r.services_count||0}</td><td>${r.materials_count||0}</td><td>${r.evidence_count||0}</td><td><button class="link-button" onclick="openDetail('${r.id}')">Ver detalhes</button></td></tr>`).join('')+'</tbody></table>'}catch(e){$('list').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
async function openDetail(id){try{const r=await api('/api/adm/diario/'+encodeURIComponent(id));$('detail').hidden=false;$('detailTitle').textContent='Diário · '+fmt(r.started_at);$('detailMeta').innerHTML=`<div><strong>Colaborador</strong><span>${esc(r.employee)||'Não informado'}</span></div><div><strong>Início</strong><span>${fmt(r.started_at)}</span></div><div><strong>Fim</strong><span>${fmt(r.ended_at)}</span></div><div><strong>Duração</strong><span>${duration(r.started_at,r.ended_at)}</span></div><div><strong>Observações</strong><span>${esc(r.general_notes)||'—'}</span></div>`;const mats=r.materials||[],ev=r.evidences||[];$('detailServices').innerHTML=(r.services||[]).map((s,i)=>{const mm=mats.filter(m=>m.service_id===s.id),ee=ev.filter(e=>e.service_id===s.id);return `<article class="admin-point"><div><b>Serviço ${i+1} · ${esc(s.title)||'Sem título'}</b><span>Local: ${esc(s.location)||'—'}</span>${s.notes?`<em>${esc(s.notes)}</em>`:''}<span>Materiais: ${mm.length?mm.map(m=>`${esc(m.qty)} ${esc(m.unit)} ${esc(m.name)}`).join(' · '):'Nenhum'}</span></div><div>${ee.map(e=>`<a href="/api/files/${encodeURIComponent(e.r2_key)}" target="_blank">📎 ${esc(e.filename||'Evidência')}</a>`).join(' ')||'<span>Sem evidência</span>'}</div></article>`}).join('')||'<p class="muted">Nenhum serviço registrado.</p>'}catch(e){alert(e.message)}}
$('search').onclick=load;$('refresh').onclick=load;$('closeDetail').onclick=()=>$('detail').hidden=true;load();
</script></body></html>
