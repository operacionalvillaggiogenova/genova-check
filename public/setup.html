<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123047"><link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="auth.css"><title>Configuração inicial — Genova Suite</title>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-brand"><span class="mark">✓</span><span>Genova Suite</span></div>
      <h1>Configuração inicial</h1>
      <p class="intro">Crie o primeiro administrador. Esta página é desativada automaticamente depois do cadastro.</p>
      <form id="setupForm" class="auth-form">
        <label>Nome completo<input id="name" autocomplete="name" required autofocus></label>
        <label>Usuário<input id="username" autocomplete="username" minlength="3" required></label>
        <label>E-mail, se desejar<input id="email" type="email" autocomplete="email"></label>
        <label>Equipe principal<select id="team"><option value="ZELADORIA">Zeladoria</option><option value="MANUTENCAO">Manutenção</option><option value="PORTARIA">Portaria</option><option value="VIGILANCIA">Vigilantes</option></select></label>
        <label>Senha inicial<input id="password" type="password" minlength="8" autocomplete="new-password" required></label>
        <button id="submitButton" class="primary-button" type="submit">Criar administrador</button>
        <p id="feedback" class="auth-feedback" role="alert"></p>
      </form>
    </section>
  </main>
  <script src="auth-client.js"></script><script src="setup.js"></script>
</body>
</html>
