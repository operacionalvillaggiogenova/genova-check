<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123047">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="auth.css">
  <title>Entrar — Genova Suite</title>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-brand"><span class="mark">✓</span><span>Genova Suite</span></div>
      <h1>Acesso ao sistema</h1>
      <p class="intro">Entre para consultar suas atividades e ferramentas de campo.</p>
      <form id="loginForm" class="auth-form">
        <label>Usuário ou e-mail<input id="username" autocomplete="username" required autofocus></label>
        <label>Senha<input id="password" type="password" autocomplete="current-password" required></label>
        <button id="submitButton" class="primary-button" type="submit">Entrar</button>
        <p id="feedback" class="auth-feedback" role="alert"></p>
      </form>
      <a class="public-link" href="/solicitar.html">Abrir um chamado</a>
      <p class="auth-help">A redefinição de senha é realizada pelo administrador do sistema.</p>
    </section>
  </main>
  <script src="auth-client.js"></script>
  <script src="login.js"></script>
</body>
</html>
