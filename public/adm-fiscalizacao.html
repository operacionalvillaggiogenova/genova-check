<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123047"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="adm.css"><title>Blexo — Adm-Fiscalização</title></head><body>
<header class="topbar"><a class="brand" href="/adm.html"><span class="brand-mark">✓</span><span>Blexo-<strong>Adm-Fiscalização</strong></span></a><div class="top-actions"><span class="online-status">● Online</span></div></header>
<main><section class="hero compact-hero"><p class="eyebrow">ADMINISTRAÇÃO</p><h1>Adm-Fiscalização</h1><p>Histórico das fiscalizações, unidades, irregularidades, fiscais e evidências.</p></section>
<section class="card"><div class="filters"><label>De<input id="from" type="date"></label><label>Até<input id="to" type="date"></label><label>Fiscal<input id="inspector" placeholder="Nome"></label><button id="search">Pesquisar</button></div></section>
<section class="card"><div class="section-title"><h2>Resumo</h2><button id="refresh" class="secondary-button">↻ Atualizar</button></div><div id="summary" class="admin-summary"></div></section>
<section class="card"><div class="section-title"><h2>Fiscalizações registradas</h2></div><div id="list" class="admin-table-wrap"><p class="muted">Carregando...</p></div></section>
<section id="detail" class="card" hidden><div class="section-title"><h2 id="detailTitle">Detalhes</h2><button id="closeDetail" class="secondary-button">Fechar</button></div><div id="detailMeta" class="detail-meta"></div><div id="detailItems"></div></section></main>
<script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function date(v){return v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR'):'—'}
async function api(u){const r=await fetch(u,{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Erro');return d}
async function load(){const q=new URLSearchParams();if($('from').value)q.set('from',$('from').value);if($('to').value)q.set('to',$('to').value);if($('inspector').value)q.set('inspector',$('inspector').value);try{const rows=await api('/api/adm/fiscalizacao?'+q);const items=rows.reduce((s,r)=>s+Number(r.items_count||0),0),ev=rows.reduce((s,r)=>s+Number(r.evidence_count||0),0),blocks=rows.reduce((s,r)=>s+Number(r.blocks_count||0),0);$('summary').innerHTML=`<div><strong>${rows.length}</strong><span>Fiscalizações</span></div><div><strong>${items}</strong><span>Irregularidades</span></div><div><strong>${ev}</strong><span>Evidências</span></div>`;if(!rows.length){$('list').innerHTML='<p class="muted">Nenhuma fiscalização encontrada.</p>';return}$('list').innerHTML='<table><thead><tr><th>Data</th><th>Fiscal</th><th>Registros</th><th>Blocos</th><th>Evidências</th><th></th></tr></thead><tbody>'+rows.map(r=>`<tr><td>${date(r.report_date)}</td><td>${esc(r.inspector)||'—'}</td><td>${r.items_count||0}</td><td>${r.blocks_count||0}</td><td>${r.evidence_count||0}</td><td><button class="link-button" onclick="openDetail('${r.id}')">Ver detalhes</button></td></tr>`).join('')+'</tbody></table>'}catch(e){$('list').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
async function openDetail(id){try{const r=await api('/api/adm/fiscalizacao/'+encodeURIComponent(id));$('detail').hidden=false;$('detailTitle').textContent='Fiscalização · '+date(r.report_date);$('detailMeta').innerHTML=`<div><strong>Nome</strong><span>${esc(r.name)||'—'}</span></div><div><strong>Fiscal</strong><span>${esc(r.inspector)||'—'}</span></div><div><strong>Data</strong><span>${date(r.report_date)}</span></div><div><strong>Observações</strong><span>${esc(r.notes)||'—'}</span></div>`;const ev=(r.evidences||[]);$('detailItems').innerHTML=(r.items||[]).map(i=>{const ee=ev.filter(e=>e.item_id===i.id);return `<article class="admin-point"><div><b>${esc(i.block)||'Bloco não informado'} · Unidade ${esc(i.unit)||'—'}</b><span>${esc(i.category)||'Irregularidade'}</span>${i.description?`<em>${esc(i.description)}</em>`:''}</div><div>${ee.map(e=>`<a href="/api/files/${encodeURIComponent(e.r2_key)}" target="_blank">📎 Evidência</a>`).join(' ')||'<span>Sem evidência</span>'}</div></article>`}).join('')||'<p class="muted">Nenhum registro.</p>'}catch(e){alert(e.message)}}
$('search').onclick=load;$('refresh').onclick=load;$('closeDetail').onclick=()=>$('detail').hidden=true;load();
</script></body></html>
