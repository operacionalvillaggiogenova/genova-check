<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Detalhes da Atividade - Blexo V11</title>
  <link rel="stylesheet" href="v11.css">
  <style>
    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .meta-item { background: var(--bg); padding: 12px; border-radius: var(--radius-sm); font-size: 14px; }
    .meta-label { color: var(--muted); font-size: 11px; text-transform: uppercase; font-weight: 800; margin-bottom: 4px; letter-spacing: 0.5px; }
    .meta-value { font-weight: 600; line-height: 1.3; }
    .action-bar { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
    .action-bar .btn { flex: 1; min-width: 120px; }
    .history-item { padding: 16px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .history-item:last-child { border-bottom: none; }
    .history-time { color: var(--muted); font-size: 12px; margin-bottom: 6px; font-weight: 600; }
    .evidence-card { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; background: var(--white); }
    .evidence-thumb { width: 48px; height: 48px; border-radius: 6px; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 20px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="container" id="content">
    <div style="text-align:center; padding: 40px;" class="text-muted">Carregando...</div>
  </div>

  <dialog id="evidenceModal">
    <form id="evidenceForm">
      <div class="dialog-header">
        <h2 style="font-size: 18px;">Concluir Atividade</h2>
        <button type="button" class="btn btn-outline" id="btnCloseEvidenceTop" style="border:none; padding:8px; min-height:unset;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="dialog-content">
        <div id="evHint" class="badge badge-warning mb-4 hidden" style="white-space:normal; text-align:left; line-height:1.4;">Esta atividade exige uma evidência fotográfica. Envie o arquivo antes de concluir.</div>
        <div class="form-group hidden" id="evUploadGroup">
          <label for="evFile">Foto / Arquivo</label>
          <input type="file" id="evFile" accept="image/*,application/pdf" capture="environment">
        </div>
        <div class="form-group">
          <label for="evNote">Observação de Conclusão</label>
          <textarea id="evNote" rows="4" required placeholder="Detalhes de como a atividade foi resolvida..."></textarea>
        </div>
        <div id="evError" class="error-msg hidden"></div>
      </div>
      <div class="dialog-footer">
        <button type="button" class="btn btn-outline" id="btnCancelEvidence">Cancelar</button>
        <button type="submit" class="btn btn-success" id="evSubmitBtn">Finalizar Atividade</button>
      </div>
    </form>
  </dialog>

  <script src="v11-api.js"></script>
  <script src="v11-shell.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const activityId = urlParams.get('id');
    let currentActivity = null;

    async function load() {
      if (!activityId) return window.location.href = '/activities';
      try {
        currentActivity = await api.activities.get(activityId);
        render();
        loadHistoryAndEvidence();
        loadChecklists();
        loadExecutionRecords();
        loadRecurringHistory();
      } catch(e) {
        document.getElementById('content').innerHTML = `
          <div class="mb-4"><a href="/activities" class="btn btn-outline"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Voltar</a></div>
          <div class="card error-msg text-center" style="padding:40px;">${shell.escape(e.message)}</div>
        `;
      }
    }

    async function loadChecklists() {
      const container = document.getElementById('checklists');
      if (!container) return;
      try {
        const lists = await api.checklists.list(activityId);
        const canExecute = shell.has('activities.start') && !['completed','cancelled'].includes(currentActivity.status);
        container.innerHTML = `${shell.has('activities.update') ? '<button id="newChecklist" class="btn btn-outline" style="margin-bottom:12px">Adicionar checklist</button>' : ''}` + (lists.length ? lists.map(list => `<div class="card" style="margin-bottom:12px"><strong>${shell.escape(list.title)}</strong>${list.items.map(item => `<label class="switch-line text-sm"><span>${shell.escape(item.label)}</span><input type="checkbox" data-checklist="${list.id}" data-item="${item.id}" ${item.checked_at?'checked':''} ${canExecute?'':'disabled'}></label>`).join('')}</div>`).join('') : '<div class="card text-muted">Nenhum checklist vinculado.</div>');
        container.querySelectorAll('input[data-item]').forEach(input => input.addEventListener('change', async () => { try { await api.checklists.setItem(activityId,input.dataset.checklist,input.dataset.item,input.checked); } catch(e) { input.checked=!input.checked; alert(e.message); } }));
        document.getElementById('newChecklist')?.addEventListener('click', async () => { const title=prompt('Título do checklist:'); if(!title)return; const items=prompt('Itens, um por linha:'); if(!items)return; try { await api.checklists.create(activityId,{title,items:items.split('\n')}); loadChecklists(); } catch(e) { alert(e.message); } });
      } catch(e) { container.innerHTML='<div class="error-msg">Não foi possível carregar o checklist.</div>'; }
    }

    async function loadHistoryAndEvidence() {
      if (shell.has('activities.evidence')) {
        try {
          const evs = await api.activities.evidence(activityId);
          const c = document.getElementById('evidence-list');
          if(c) c.innerHTML = evs.length ? evs.map(e => `
            <div class="evidence-card">
              <div class="flex items-center gap-3">
                <div class="evidence-thumb"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></div>
                <div>
                  <div class="font-bold text-sm" style="word-break:break-all;">${shell.escape(e.filename)}</div>
                  <div class="text-muted" style="font-size: 11px; margin-top:2px;">
                    ${shell.formatDate(e.capturedAt || e.createdAt)} • ${e.source === 'camera' ? 'Câmera' : 'Galeria'}${e.note ? ' • '+shell.escape(e.note) : ''}
                  </div>
                </div>
              </div>
              <a href="${api.activities.getEvidenceUrl(activityId, e.id)}" target="_blank" class="btn btn-outline" style="padding: 6px 12px; min-height:unset; font-size:13px; border-color:var(--line);">Visualizar</a>
            </div>
          `).join('') : '<div class="text-sm text-muted text-center py-4">Nenhuma evidência anexada.</div>';
        } catch(e){}
      }
      try {
        const hist = await api.activities.history(activityId);
        const c = document.getElementById('history-list');
        if(c) c.innerHTML = hist.map(h => `
          <div class="history-item">
            <div class="history-time">${shell.formatDate(h.createdAt)} • ${shell.escape(h.performedBy.name)}</div>
            <div style="line-height:1.4;">${shell.escape(h.description || h.action)}</div>
          </div>
        `).join('');
      } catch(e){}
    }

    async function loadExecutionRecords() {
      const canAdd = shell.has('activities.start') || shell.has('activities.update');
      try {
        const [notes, materials] = await Promise.all([api.activityNotes.list(activityId), api.materials.list(activityId)]);
        const notesEl=document.getElementById('notes-list'), materialsEl=document.getElementById('materials-list');
        if(notesEl) notesEl.innerHTML=(canAdd?`<form id="noteForm" class="mb-4"><textarea id="noteBody" rows="3" placeholder="Adicionar observação sobre a execução..."></textarea><button class="btn btn-outline" style="margin-top:8px">Adicionar observação</button></form>`:'')+(notes.length?notes.map(n=>`<div class="history-item"><div class="history-time">${shell.formatDate(n.createdAt)} • ${shell.escape(n.author.name)}</div><div>${shell.escape(n.body)}</div></div>`).join(''):'<div class="text-muted text-sm">Nenhuma observação registrada.</div>');
        if(materialsEl) materialsEl.innerHTML=(canAdd?`<form id="materialForm" class="grid grid-cols-2 gap-3 mb-4"><input id="materialName" placeholder="Material" required><input id="materialQuantity" placeholder="Qtd."><input id="materialUnit" placeholder="Unidade"><button class="btn btn-outline">Adicionar material</button></form>`:'')+(materials.length?materials.map(m=>`<div class="history-item"><strong>${shell.escape(m.name)}</strong>${m.quantity?` • ${shell.escape(m.quantity)} ${shell.escape(m.unit||'')}`:''}<div class="history-time">${shell.formatDate(m.createdAt)} • ${shell.escape(m.author.name)}</div></div>`).join(''):'<div class="text-muted text-sm">Nenhum material registrado.</div>');
        document.getElementById('noteForm')?.addEventListener('submit',async e=>{e.preventDefault();try{await api.activityNotes.create(activityId,document.getElementById('noteBody').value);loadExecutionRecords();loadHistoryAndEvidence()}catch(x){alert(x.message)}});
        document.getElementById('materialForm')?.addEventListener('submit',async e=>{e.preventDefault();try{await api.materials.create(activityId,{name:document.getElementById('materialName').value,quantity:document.getElementById('materialQuantity').value,unit:document.getElementById('materialUnit').value});loadExecutionRecords();loadHistoryAndEvidence()}catch(x){alert(x.message)}});
      } catch(e) {}
    }

    async function loadRecurringHistory() {
      if (!currentActivity.templateId) return;
      try { const rows=await api.recurrences.history(currentActivity.templateId), target=document.getElementById('recurrence-history'); if(target) target.innerHTML=rows.map(row=>`<div class="history-item"><div class="history-time">Programada: ${shell.formatDate(row.scheduled_for)}</div><a href="/activity?id=${row.id}">${shell.escape(row.title)}</a> • ${shell.escape(row.status)}${row.completed_at?` • concluída: ${shell.formatDate(row.completed_at)}`:''}</div>`).join('')||'<div class="text-muted text-sm">Ainda não há ocorrências.</div>'; } catch(e) {}
    }

    function render() {
      const a = currentActivity;
      let actionsHtml = '';
      
      if (a.status === 'pending' && shell.has('activities.start')) {
        actionsHtml += `<button data-action="start" class="btn btn-primary">Iniciar Trabalho</button>`;
      }
      if (['pending', 'in_progress'].includes(a.status) && shell.has('activities.complete')) {
        actionsHtml += `<button data-action="complete" class="btn btn-success">Concluir</button>`;
      }
      if (['pending', 'in_progress'].includes(a.status) && shell.has('activities.cancel')) {
        actionsHtml += `<button data-action="cancel" class="btn btn-danger">Cancelar</button>`;
      }

      document.getElementById('content').innerHTML = `
        <div class="mb-4"><a href="/activities" class="btn btn-outline" style="padding: 8px 16px; min-height:unset; background:var(--white);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Voltar para Atividades</a></div>
        <div class="card">
          <div class="flex justify-between items-center mb-4">
            <span class="badge badge-${a.status}">${a.status === 'in_progress' ? 'Em Andamento' : a.status === 'pending' ? 'Pendente' : a.status === 'completed' ? 'Concluída' : 'Cancelada'}</span>
            <span class="badge" style="background:var(--bg)">${a.priority.toUpperCase()}</span>
          </div>
          <h1 style="font-size: 22px; margin-bottom: 24px; line-height:1.2;">${shell.escape(a.title)}</h1>
          
          <div class="meta-grid">
            <div class="meta-item"><div class="meta-label">Equipe</div><div class="meta-value">${shell.escape(a.team)}</div></div>
            <div class="meta-item"><div class="meta-label">Responsável</div><div class="meta-value">${a.assignedTo ? shell.escape(a.assignedTo.name) : '<span class="text-muted">Não atribuído</span>'}</div></div>
            <div class="meta-item"><div class="meta-label">Prazo</div><div class="meta-value ${a.dueDate && a.dueDate < new Date().toISOString() && !['completed','cancelled'].includes(a.status) ? 'error-msg font-bold' : ''}">${a.dueDate ? shell.formatDate(a.dueDate) : '-'}</div></div>
            <div class="meta-item"><div class="meta-label">Local</div><div class="meta-value">${a.location ? shell.escape(a.location) : '-'}</div></div>
          </div>
          
          ${a.description ? `<div class="mb-4"><div class="meta-label">Descrição</div><div class="text-sm" style="white-space: pre-wrap; line-height:1.5;">${shell.escape(a.description)}</div></div>` : ''}
          ${a.requiresEvidence && !['completed','cancelled'].includes(a.status) ? `<div class="badge badge-warning mb-2" style="white-space:normal; line-height:1.4;">(Foto) Requer evidência fotográfica para conclusão</div>` : ''}
          
          ${actionsHtml ? `<div class="action-bar">${actionsHtml}</div>` : ''}
        </div>

        ${shell.has('activities.evidence') ? `
        <h2 class="section-title mt-4">Evidências</h2>
        <div class="card" id="evidence-list" style="background:transparent; border:none; padding:0; box-shadow:none; margin-bottom:24px;">Carregando...</div>
        ` : ''}

        <h2 class="section-title mt-4">Observações da atividade</h2>
        <div class="card" id="notes-list" style="padding:16px;"></div>
        <h2 class="section-title mt-4">Materiais utilizados</h2>
        <div class="card" id="materials-list" style="padding:16px;"></div>

        <h2 class="section-title mt-4">Checklist</h2>
        <div id="checklists"></div>

        <h2 class="section-title mt-4">Histórico</h2>
        <div class="card" id="history-list" style="padding: 4px 16px;">Carregando...</div>
        ${a.templateId ? `<h2 class="section-title mt-4">Histórico da recorrência</h2><div class="card" id="recurrence-history" style="padding: 4px 16px;">Carregando...</div>` : ''}
      `;

      const actionBar = document.querySelector('.action-bar');
      if (actionBar) {
        actionBar.addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-action]');
          if (btn) action(btn.dataset.action);
        });
      }
    }

    async function action(type) {
      if (type === 'start' || type === 'cancel') {
        if(!confirm(`Tem certeza que deseja ${type === 'start' ? 'iniciar' : 'cancelar'} esta atividade?`)) return;
        try {
          await api.activities[type](activityId);
          load();
        } catch(e) { alert(e.message); }
      } else if (type === 'complete') {
        const reqEv = currentActivity.requiresEvidence;
        document.getElementById('evHint').classList.toggle('hidden', !reqEv);
        document.getElementById('evUploadGroup').classList.toggle('hidden', !reqEv);
        if(!reqEv) {
          document.getElementById('evNote').removeAttribute('required');
        } else {
          document.getElementById('evNote').setAttribute('required', 'true');
        }
        document.getElementById('evidenceModal').showModal();
      }
    }

    shell.init().then(() => {
      load();
      
      document.getElementById('btnCloseEvidenceTop').addEventListener('click', () => document.getElementById('evidenceModal').close());
      document.getElementById('btnCancelEvidence').addEventListener('click', () => document.getElementById('evidenceModal').close());
      
      document.getElementById('evidenceForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('evSubmitBtn');
        const err = document.getElementById('evError');
        btn.disabled = true; err.classList.add('hidden');
        try {
          const reqEv = currentActivity.requiresEvidence;
          const file = document.getElementById('evFile').files[0];
          const note = document.getElementById('evNote').value;
          
          if (reqEv && file) {
            await api.activities.uploadEvidence(activityId, file, note, 'camera');
          } else if (reqEv && !file) {
            throw new Error("Você precisa anexar um arquivo/foto para concluir esta atividade.");
          }
          
          await api.activities.complete(activityId, note);
          document.getElementById('evidenceModal').close();
          e.target.reset();
          load();
        } catch(error) {
          err.textContent = error.message; err.classList.remove('hidden');
        } finally {
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
