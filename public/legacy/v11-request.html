<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitar atendimento - Blexo</title><link rel="stylesheet" href="v11.css"><body><main class="container" style="max-width:560px"><h1 class="page-title">Solicitar atendimento</h1><p class="text-muted">Registre um problema; a equipe receberá uma atividade.</p><form id="form" class="card"><div class="form-group"><label>Categoria</label><select name="category"><option value="limpeza">Limpeza</option><option value="manutencao">Manutenção</option><option value="estrutural">Problema estrutural</option><option value="hidraulica">Hidráulica</option><option value="eletrica">Elétrica</option><option value="area_externa">Área externa</option><option value="servicos_gerais">Serviços gerais</option><option value="outro">Outro</option></select></div><div class="form-group"><label>Local</label><input name="location" required></div><div class="form-group"><label>Descrição</label><textarea name="description" required minlength="5"></textarea></div><div class="form-group"><label>Foto (opcional)</label><input name="photo" type="file" accept="image/*"></div><div class="form-group"><label>Contato (opcional)</label><input name="contact"></div><div id="message" class="text-muted"></div><button class="btn btn-primary" style="margin-top:16px">Enviar solicitação</button></form></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('message');m.textContent='Enviando…';try{const r=await fetch('/api/requests',{method:'POST',body:new FormData(e.target)}),d=await r.json();if(!r.ok)throw Error(d.error);e.target.reset();m.textContent='Solicitação enviada com sucesso.'}catch(x){m.textContent=x.message}}</script></body></html>
