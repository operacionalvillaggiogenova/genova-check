<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123047"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="adm.css"><title>Blexo — Adm-Ronda</title></head><body>
<header class="topbar"><a class="brand" href="/adm.html"><span class="brand-mark">✓</span><span>Blexo-<strong>Adm-Ronda</strong></span></a><div class="top-actions"><span id="status" class="online-status">● Online</span></div></header>
<main><section class="hero compact-hero"><p class="eyebrow">ADMINISTRAÇÃO</p><h1>Adm-Ronda</h1><p>Histórico centralizado das rondas, horários, vigilantes, pontos e ocorrências.</p></section>
<section class="card"><div class="filters"><label>De<input id="from" type="date"></label><label>Até<input id="to" type="date"></label><label>Vigilante<input id="vigilante" placeholder="Nome"></label><button id="search">Pesquisar</button></div></section>
<section class="card"><div class="section-title"><h2>Rondas registradas</h2><button id="refresh" class="secondary-button">↻ Atualizar</button></div><div id="summary" class="admin-summary"></div><div id="list" class="admin-table-wrap"><p class="muted">Carregando...</p></div></section>
<section id="detail" class="card" hidden><div class="section-title"><h2 id="detailTitle">Detalhes da ronda</h2><button id="closeDetail" class="secondary-button">Fechar</button></div><div id="detailMeta" class="detail-meta"></div><div id="detailPoints"></div></section></main>
<script>
const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(v){return v?new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'}).format(new Date(v)):'—'}
async function api(url){const r=await fetch(url,{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Erro');return d}
async function load(){const qs=new URLSearchParams();if($('from').value)qs.set('from',$('from').value);if($('to').value)qs.set('to',$('to').value);if($('vigilante').value)qs.set('vigilante',$('vigilante').value);try{const rows=await api('/api/adm/ronda?'+qs);const total=rows.reduce((s,r)=>s+Number(r.total_points||0),0),checked=rows.reduce((s,r)=>s+Number(r.checked_points||0),0),occ=rows.reduce((s,r)=>s+Number(r.occurrences||0),0);$('summary').innerHTML=`<div><strong>${rows.length}</strong><span>Rondas</span></div><div><strong>${checked}/${total}</strong><span>Pontos registrados</span></div><div><strong>${occ}</strong><span>Ocorrências</span></div>`;if(!rows.length){$('list').innerHTML='<p class="muted">Nenhuma ronda encontrada.</p>';return}$('list').innerHTML='<table><thead><tr><th>Data</th><th>Vigilante</th><th>Pontos</th><th>Ocorrências</th><th>Duração</th><th></th></tr></thead><tbody>'+rows.map(r=>`<tr><td>${fmt(r.started_at)}</td><td>${esc(r.vigilante)||'—'}</td><td>${Number(r.checked_points||0)}/${Number(r.total_points||0)}</td><td>${Number(r.occurrences||0)}</td><td>${duration(r.started_at,r.ended_at)}</td><td><button class="link-button" onclick="openDetail('${r.id}')">Ver detalhes</button></td></tr>`).join('')+'</tbody></table>'}catch(e){$('list').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
function duration(a,b){if(!a)return'—';if(!b)return'Em andamento';const m=Math.max(0,Math.round((new Date(b)-new Date(a))/60000));return `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}min`}
async function openDetail(id){try{const r=await api('/api/adm/ronda/'+encodeURIComponent(id));$('detail').hidden=false;$('detailTitle').textContent='Ronda · '+fmt(r.started_at);$('detailMeta').innerHTML=`<div><strong>Vigilante</strong><span>${esc(r.vigilante)||'Não informado'}</span></div><div><strong>Início</strong><span>${fmt(r.started_at)}</span></div><div><strong>Fim</strong><span>${fmt(r.ended_at)}</span></div><div><strong>Observações</strong><span>${esc(r.notes)||'—'}</span></div>`;$('detailPoints').innerHTML='<div class="ronda-admin-points">'+(r.checkpoints||[]).map((p,i)=>`<article class="admin-point"><div><b>${i+1}. ${esc(p.point_name)}</b><span>${p.status==='CHECKED'?'✓ Registrado':'Pendente'} · ${fmt(p.checked_at)}</span>${p.occurrence?`<em>${esc(p.occurrence)}</em>`:''}</div>${p.evidence_key?`<a href="/api/files/${encodeURIComponent(p.evidence_key)}" target="_blank">Evidência</a>`:''}</article>`).join('')+'</div>'}catch(e){alert(e.message)}}
$('search').onclick=load;$('refresh').onclick=load;$('closeDetail').onclick=()=>$('detail').hidden=true;load();
</script></body></html>
