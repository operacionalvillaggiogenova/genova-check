<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recorrências - Blexo</title><link rel="stylesheet" href="v11.css"></head><body><main class="container"><div class="flex justify-between items-center mb-4"><div><h1 class="page-title" style="margin:0">Recorrências</h1><p class="text-muted text-sm">Modelos separados; somente ocorrências geradas aparecem nas pendências.</p></div><button id="new" class="btn btn-primary hidden">Nova recorrência</button></div><div id="list"></div></main><dialog id="modal"><form id="form"><div class="dialog-header"><h2>Nova recorrência</h2><button type="button" class="btn btn-outline" onclick="modal.close()">Fechar</button></div><div class="dialog-content"><div class="form-group"><label>Título</label><input id="title" required minlength="3"></div><div class="grid grid-cols-2 gap-3"><div class="form-group"><label>Equipe</label><select id="team"><option value="MANUTENCAO">Manutenção</option><option value="LIMPEZA">Limpeza</option><option value="SERVICOS_GERAIS">Serviços gerais</option><option value="ZELADORIA">Zeladoria</option><option value="LEITURISTA">Leiturista</option></select></div><div class="form-group"><label>Frequência</label><select id="kind"><option value="daily">Diária</option><option value="weekly">Semanal</option><option value="monthly">Mensal</option><option value="custom">Personalizada (dias)</option></select></div></div><div class="grid grid-cols-2 gap-3"><div class="form-group"><label>Intervalo</label><input id="interval" type="number" min="1" value="1"></div><div class="form-group"><label>Primeira execução</label><input id="starts" type="datetime-local" required></div></div><div class="form-group"><label>Descrição</label><textarea id="description"></textarea></div><div class="form-group"><label><input id="evidence" type="checkbox" style="width:auto;min-height:auto"> Exigir evidência</label></div><div id="err" class="error-msg hidden"></div></div><div class="dialog-footer"><button class="btn btn-primary">Salvar</button></div></form></dialog></body><script src="v11-api.js"></script><script src="v11-shell.js"></script><script>const $=id=>document.getElementById(id);async function load(){const rows=await api.recurrences.list();$('list').innerHTML=rows.length?rows.map(r=>`<article class="card"><div class="flex justify-between items-center"><div><strong>${shell.escape(r.title)}</strong><div class="text-muted text-sm">${shell.escape(r.team)} · ${shell.escape(r.recurrence_type)} a cada ${r.interval_value} · próxima: ${shell.formatDate(r.next_run_at)}</div></div>${shell.has('activities.update')?`<button class="btn ${r.active?'btn-danger':'btn-secondary'}" data-id="${r.id}" data-active="${r.active}">${r.active?'Pausar':'Ativar'}</button>`:''}</div></article>`).join(''):'<div class="card text-muted">Nenhuma recorrência cadastrada.</div>'}shell.init().then(()=>{if(!shell.has('activities.view'))return location.href='/dashboard';if(shell.has('activities.create'))$('new').classList.remove('hidden');$('new').onclick=()=>$('modal').showModal();$('list').onclick=async e=>{const b=e.target.closest('button[data-id]');if(b){await api.recurrences.setStatus(b.dataset.id,b.dataset.active!=='true');load()}};$('form').onsubmit=async e=>{e.preventDefault();try{await api.recurrences.create({title:$('title').value,team:$('team').value,recurrenceType:$('kind').value,intervalValue:$('interval').value,startsAt:new Date($('starts').value).toISOString(),description:$('description').value,priority:'normal',requiresEvidence:$('evidence').checked});$('modal').close();e.target.reset();load()}catch(x){$('err').textContent=x.message;$('err').classList.remove('hidden')}};load()})</script></html>
