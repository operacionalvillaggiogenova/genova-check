<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atividades - Blexo V11</title>
  <link rel="stylesheet" href="v11.css">
  <style>
    .filters { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; -ms-overflow-style: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter-chip { padding: 8px 16px; border-radius: 99px; background: var(--white); border: 1px solid var(--line); font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; color: var(--ink); transition: 0.2s; }
    .filter-chip.active { background: var(--navy); color: var(--white); border-color: var(--navy); }
    .act-card { display: block; text-decoration: none; color: inherit; padding: 16px; margin-bottom: 12px; }
    .act-card:hover { border-color: var(--blue); }
    .priority-indicator { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .pri-urgent { background: var(--danger); box-shadow: 0 0 0 2px var(--danger-bg); }
    .pri-high { background: var(--warning); }
    .pri-normal { background: var(--info); }
    .pri-low { background: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <div class="flex justify-between items-center mb-4">
      <h1 class="page-title" style="margin:0">Atividades</h1>
      <button id="btnCreate" class="btn btn-primary hidden">Nova Atividade</button>
    </div>
    
    <div class="form-group">
      <input type="search" id="searchInput" placeholder="Buscar atividades..." autocomplete="off">
    </div>
    
    <div class="filters" id="statusFilters">
      <div class="filter-chip active" data-status="">Todas</div>
      <div class="filter-chip" data-status="pending">Pendentes</div>
      <div class="filter-chip" data-status="in_progress">Em Andamento</div>
      <div class="filter-chip" data-status="completed">Concluídas</div>
    </div>
    
    <div id="list"></div>
  </div>

  <dialog id="createModal">
    <form id="createForm">
      <div class="dialog-header">
        <h2 style="font-size: 18px;">Nova Atividade</h2>
        <button type="button" class="btn btn-outline" id="btnCloseCreateTop" style="border:none; padding:8px; min-height:unset;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="dialog-content">
        <div class="form-group">
          <label for="cTitle">Título</label>
          <input type="text" id="cTitle" required>
        </div>
        <div class="form-group">
          <label for="cTeam">Equipe Responsável</label>
          <select id="cTeam" required>
            <option value="GERAL">Geral</option>
            <option value="ZELADORIA">Zeladoria</option>
            <option value="MANUTENCAO">Manutenção</option>
            <option value="ADMIN">Administração</option>
          </select>
        </div>
        <div class="form-group">
          <label for="cAssigned">Atribuir para (Opcional)</label>
          <select id="cAssigned"></select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="form-group">
            <label for="cPriority">Prioridade</label>
            <select id="cPriority">
              <option value="normal">Normal</option>
              <option value="low">Baixa</option>
              <option value="high">Alta</option>
              <option value="urgent">Urgente</option>
            </select>
          </div>
          <div class="form-group">
            <label for="cDue">Prazo</label>
            <input type="date" id="cDue">
          </div>
        </div>
        <div class="form-group">
          <label for="cLocation">Localização (Opcional)</label>
          <input type="text" id="cLocation" placeholder="Ex: Bloco A - Cobertura">
        </div>
        <div class="form-group">
          <label for="cDesc">Descrição</label>
          <textarea id="cDesc" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="cChecklist">Checklist (um item por linha)</label>
          <textarea id="cChecklist" rows="3" placeholder="Ex.: Verificar válvula&#10;Registrar leitura"></textarea>
        </div>
        <div class="form-group flex items-center gap-2" style="background: var(--sky); padding: 12px; border-radius: var(--radius-sm);">
          <input type="checkbox" id="cEvidence" style="width:20px; min-height:unset; margin:0;" checked>
          <label for="cEvidence" style="margin:0; flex:1;">Exigir evidência fotográfica para concluir</label>
        </div>
        <div id="cError" class="error-msg hidden"></div>
      </div>
      <div class="dialog-footer">
        <button type="button" class="btn btn-outline" id="btnCancelCreate">Cancelar</button>
        <button type="submit" class="btn btn-primary">Criar Atividade</button>
      </div>
    </form>
  </dialog>

  <script src="v11-api.js"></script>
  <script src="v11-shell.js"></script>
  <script>
    let currentStatus = '';
    
    async function loadActivities() {
      const q = document.getElementById('searchInput').value;
      const listEl = document.getElementById('list');
      listEl.innerHTML = '<div style="text-align:center; padding: 40px;" class="text-muted">Carregando...</div>';
      try {
        const activities = await api.activities.list(currentStatus, q);
        if (activities.length === 0) {
          listEl.innerHTML = '<div class="card text-center text-muted" style="padding:40px;">Nenhuma atividade encontrada.</div>';
          return;
        }
        listEl.innerHTML = activities.map(a => `
          <a href="/activity?id=${a.id}" class="card act-card">
            <div class="flex justify-between items-center mb-2">
              <div class="text-sm text-muted font-bold">
                <span class="priority-indicator pri-${a.priority}"></span>
                ${shell.escape(a.team)} ${a.assignedTo ? '• ' + shell.escape(a.assignedTo.name) : ''}
              </div>
              <span class="badge badge-${a.status}">${a.status}</span>
            </div>
            <strong style="font-size: 16px; display: block; margin-bottom: 8px; line-height:1.3;">${shell.escape(a.title)}</strong>
            <div class="flex justify-between text-sm text-muted">
              <span>${a.location ? 'Local: ' + shell.escape(a.location) : 'Sem local'}</span>
              <span style="${a.dueDate && a.dueDate < new Date().toISOString() && !['completed','cancelled'].includes(a.status) ? 'color: var(--danger); font-weight: bold;' : ''}">
                ${a.dueDate ? 'Prazo: ' + shell.formatDate(a.dueDate) : '-'}
              </span>
            </div>
          </a>
        `).join('');
      } catch(e) {
        listEl.innerHTML = `<div class="card error-msg text-center" style="padding:20px;">${shell.escape(e.message)}</div>`;
      }
    }

    shell.init().then(async () => {
      if (!shell.has('activities.view')) return window.location.href = '/dashboard';
      try { const teams=await api.teams.list(); document.getElementById('cTeam').innerHTML=teams.filter(t=>t.active).map(t=>`<option value="${shell.escape(t.code)}">${shell.escape(t.label)}</option>`).join(''); } catch(e) {}
      
      document.getElementById('btnCloseCreateTop').addEventListener('click', () => document.getElementById('createModal').close());
      document.getElementById('btnCancelCreate').addEventListener('click', () => document.getElementById('createModal').close());

      if (shell.has('activities.create')) {
        document.getElementById('btnCreate').classList.remove('hidden');
        document.getElementById('btnCreate').addEventListener('click', async () => {
          try {
            const users = await api.users.list(true);
            const select = document.getElementById('cAssigned');
            select.innerHTML = '<option value="">(Nenhum responsável específico)</option>' + 
              users.map(u => `<option value="${u.id}">${shell.escape(u.name)} (${shell.escape(u.team)})</option>`).join('');
          } catch(e){
            const select = document.getElementById('cAssigned');
            select.innerHTML = '<option value="">(Nenhum responsável específico)</option>';
          }
          document.getElementById('createModal').showModal();
        });
      }
      
      document.getElementById('statusFilters').addEventListener('click', (e) => {
        if(e.target.classList.contains('filter-chip')) {
          document.querySelectorAll('.filter-chip').forEach(el => el.classList.remove('active'));
          e.target.classList.add('active');
          currentStatus = e.target.dataset.status;
          loadActivities();
        }
      });
      
      let searchTimeout;
      document.getElementById('searchInput').addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(loadActivities, 400);
      });
      
      document.getElementById('createForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        const err = document.getElementById('cError');
        btn.disabled = true; err.classList.add('hidden');
        try {
          const dueInput = document.getElementById('cDue').value;
          await api.activities.create({
            title: document.getElementById('cTitle').value,
            team: document.getElementById('cTeam').value,
            assignedToId: document.getElementById('cAssigned').value || null,
            priority: document.getElementById('cPriority').value,
            dueDate: dueInput ? new Date(dueInput + 'T12:00:00').toISOString() : null,
            location: document.getElementById('cLocation').value,
            description: document.getElementById('cDesc').value,
            checklists: document.getElementById('cChecklist').value.trim() ? [{ title: 'Checklist da atividade', items: document.getElementById('cChecklist').value.split('\n') }] : [],
            requiresEvidence: document.getElementById('cEvidence').checked
          });
          document.getElementById('createModal').close();
          e.target.reset();
          loadActivities();
        } catch(error) {
          err.textContent = error.message; err.classList.remove('hidden');
        } finally {
          btn.disabled = false;
        }
      });

      loadActivities();
    });
  </script>
</body>
</html>
