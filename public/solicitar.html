<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123047"><link rel="icon" href="favicon.png"><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="v11.css"><title>Abrir chamado — blexo-suite</title></head>
<body><main class="auth-shell"><section class="auth-card" style="width:min(620px,100%)"><div class="auth-brand"><span class="mark">✓</span><span>blexo-suite</span></div><h1>Abrir chamado</h1><p class="intro">Informe o problema encontrado. O chamado será encaminhado à equipe responsável.</p>
<form id="requestForm" class="auth-form"><div class="form-grid"><label>Categoria<select id="category" required><option>Carregando…</option></select></label><label>Local<input id="location" maxlength="250" placeholder="Bloco, área ou referência" required></label><label class="full">Descrição<textarea id="description" rows="5" maxlength="4000" required></textarea></label><label>Seu nome, se desejar<input id="contactName" maxlength="120"></label><label>Contato, se desejar<input id="contactValue" maxlength="180"></label><label class="full">Foto opcional<input id="photo" type="file" accept="image/*" capture="environment"></label></div><button id="submitButton" class="primary-button">Enviar chamado</button><p id="feedback" class="auth-feedback" role="alert"></p></form><div id="success" hidden class="account-summary" style="margin-top:18px"></div><a class="public-link" href="/login.html">Acessar o sistema</a></section></main><script src="public-request.js"></script></body></html>
